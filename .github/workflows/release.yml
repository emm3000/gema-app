name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      track:
        description: Play Console track to publish the bundle to.
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode the upload keystore
        env:
          GEMA_UPLOAD_KEYSTORE_BASE64: ${{ secrets.GEMA_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$GEMA_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "No upload keystore secret; the bundle will be built unsigned."
            exit 0
          fi
          printf '%s' "$GEMA_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "GEMA_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build the release bundle
        env:
          GEMA_STORE_PASSWORD: ${{ secrets.GEMA_STORE_PASSWORD }}
          GEMA_KEY_ALIAS: ${{ secrets.GEMA_KEY_ALIAS }}
          GEMA_KEY_PASSWORD: ${{ secrets.GEMA_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload the release bundle
        uses: actions/upload-artifact@v4
        with:
          name: gema-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish
    needs: bundle
    if: github.event_name == 'workflow_dispatch' && vars.PLAY_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download the release bundle
        uses: actions/download-artifact@v4
        with:
          name: gema-release-bundle

      - name: Upload the bundle to Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.emm.gema
          releaseFiles: app-release.aab
          track: ${{ inputs.track }}
          status: draft
