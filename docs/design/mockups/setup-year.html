<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; color: #17181A; background: #FFFFFF; }
    a { color: #3F6836; } a:hover { color: #285020; }
  </style>
</head>
<body>
<div style="width: 360px; height: 800px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; display: flex; flex-direction: column;">
  <div style="display: flex; flex-direction: column; gap: 6px; padding: 32px 16px 0 16px;">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 1px; color: #6E7075;">PASO 1 DE 2</div>
    <div style="font-size: 24px; font-weight: 600; line-height: 1.2; letter-spacing: -0.3px;">Tu año escolar</div>
    <div style="font-size: 15px; line-height: 1.45; color: #6E7075;">Calculamos las fechas de los periodos por ti. Puedes ajustar cualquiera.</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 24px 16px 0 16px;">
    <div style="height: 56px; padding: 0 14px; display: flex; flex-direction: column; justify-content: center; gap: 2px; border: 1px solid #C9C9C5; border-radius: 8px; box-sizing: border-box;"><div style="font-size: 11px; color: #6E7075;">Año</div><div style="font-size: 15px; line-height: 1.2;">2026</div></div>
    <div style="display: flex; gap: 8px;">
      <div style="flex-grow: 1; height: 56px; padding: 0 12px 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 1px solid #C9C9C5; border-radius: 8px; box-sizing: border-box;"><div style="display: flex; flex-direction: column; gap: 2px;"><div style="font-size: 11px; color: #6E7075;">Inicio</div><div style="font-size: 15px; line-height: 1.2; font-variant-numeric: tabular-nums;">01/03/2026</div></div><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E7075" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18"></path><path d="M8 3v4"></path><path d="M16 3v4"></path></svg></div>
      <div style="flex-grow: 1; height: 56px; padding: 0 12px 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 1px solid #C9C9C5; border-radius: 8px; box-sizing: border-box;"><div style="display: flex; flex-direction: column; gap: 2px;"><div style="font-size: 11px; color: #6E7075;">Fin</div><div style="font-size: 15px; line-height: 1.2; font-variant-numeric: tabular-nums;">20/12/2026</div></div><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6E7075" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18"></path><path d="M8 3v4"></path><path d="M16 3v4"></path></svg></div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 24px 16px 0 16px;">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 1px; color: #6E7075;">¿CÓMO EVALÚA TU ESCUELA?</div>
    <div style="display: flex; height: 48px; border: 1px solid #C9C9C5; border-radius: 8px; overflow: hidden;">
      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; background: #E4EFD9; color: #285020;">Bimestres (4)</div>
      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; font-size: 15px; border-left: 1px solid #C9C9C5;">Trimestres (3)</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; padding: 24px 16px 0 16px;">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 1px; color: #6E7075; padding-bottom: 4px;">PERIODOS</div>
    <div style="display: flex; align-items: center; gap: 12px; height: 48px; border-top: 1px solid #E6E6E3;"><div style="width: 28px; font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums;">I</div><div style="flex-grow: 1; font-size: 15px;">1 mar – 15 may</div><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6E7075" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></div>
    <div style="display: flex; align-items: center; gap: 12px; height: 48px; border-top: 1px solid #E6E6E3;"><div style="width: 28px; font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums;">II</div><div style="flex-grow: 1; font-size: 15px;">18 may – 31 jul</div><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6E7075" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></div>
    <div style="display: flex; align-items: center; gap: 12px; height: 48px; border-top: 1px solid #E6E6E3;"><div style="width: 28px; font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums;">III</div><div style="flex-grow: 1; font-size: 15px;">10 ago – 16 oct</div><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6E7075" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></div>
    <div style="display: flex; align-items: center; gap: 12px; height: 48px; border-top: 1px solid #E6E6E3; border-bottom: 1px solid #E6E6E3;"><div style="width: 28px; font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums;">IV</div><div style="flex-grow: 1; font-size: 15px;">19 oct – 20 dic</div><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6E7075" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></div>
  </div>

  <div style="flex-grow: 1;"></div>
  <div style="flex-shrink: 0; padding: 12px 16px 16px 16px; border-top: 1px solid #E6E6E3; background: #FFFFFF;"><div style="height: 48px; display: flex; align-items: center; justify-content: center; background: #3F6836; color: #FFFFFF; font-size: 15px; font-weight: 500; border-radius: 8px;">Continuar</div></div>
</div>
</body>
</html>
