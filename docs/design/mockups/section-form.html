<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; color: #17181A; background: #FFFFFF; }
    a { color: #3F6836; } a:hover { color: #285020; }
  </style>
</head>
<body>
<div style="width: 360px; height: 800px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; display: flex; flex-direction: column;">
  <div style="display: flex; align-items: center; gap: 4px; padding: 8px 16px 0 4px;">
    <div style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17181A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></div>
    <div style="display: flex; flex-direction: column; flex-grow: 1; gap: 1px;"><div style="font-size: 18px; font-weight: 600; line-height: 1.2;">Editar sección</div><div style="font-size: 13px; color: #6E7075;">3ro A</div></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 20px 16px 0 16px;">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 1px; color: #6E7075;">GRADO</div>
    <div style="display: flex; gap: 6px;">
      <div style="flex-grow: 1; height: 48px; display: flex; align-items: center; justify-content: center; border: 1px solid #C9C9C5; border-radius: 8px; font-size: 15px; font-weight: 500;">1</div>
      <div style="flex-grow: 1; height: 48px; display: flex; align-items: center; justify-content: center; border: 1px solid #C9C9C5; border-radius: 8px; font-size: 15px; font-weight: 500;">2</div>
      <div style="flex-grow: 1; height: 48px; display: flex; align-items: center; justify-content: center; border: 2px solid #3F6836; background: #E4EFD9; border-radius: 8px; font-size: 15px; font-weight: 600;">3</div>
      <div style="flex-grow: 1; height: 48px; display: flex; align-items: center; justify-content: center; border: 1px solid #C9C9C5; border-radius: 8px; font-size: 15px; font-weight: 500;">4</div>
      <div style="flex-grow: 1; height: 48px; display: flex; align-items: center; justify-content: center; border: 1px solid #C9C9C5; border-radius: 8px; font-size: 15px; font-weight: 500;">5</div>
      <div style="flex-grow: 1; height: 48px; display: flex; align-items: center; justify-content: center; border: 1px solid #C9C9C5; border-radius: 8px; font-size: 15px; font-weight: 500;">6</div>
    </div>
  </div>

  <div style="padding: 20px 16px 0 16px;">
    <div style="height: 56px; padding: 0 14px; display: flex; flex-direction: column; justify-content: center; gap: 2px; border: 1px solid #C9C9C5; border-radius: 8px; box-sizing: border-box;"><div style="font-size: 11px; color: #6E7075;">Nombre</div><div style="font-size: 15px; line-height: 1.2;">A</div></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 32px 16px 0 16px;">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 1px; color: #6E7075;">ZONA DE RIESGO</div>
    <div style="height: 48px; display: flex; align-items: center; justify-content: center; border: 1px solid #B42318; color: #B42318; font-size: 15px; font-weight: 500; border-radius: 8px;">Eliminar sección</div>
    <div style="font-size: 13px; line-height: 1.45; color: #6E7075;">Borra alumnos, asistencia y niveles de esta sección. Te preguntamos antes.</div>
  </div>

  <div style="flex-grow: 1;"></div>
  <div style="flex-shrink: 0; padding: 12px 16px 16px 16px; border-top: 1px solid #E6E6E3; background: #FFFFFF;"><div style="height: 48px; display: flex; align-items: center; justify-content: center; background: #3F6836; color: #FFFFFF; font-size: 15px; font-weight: 500; border-radius: 8px;">Guardar</div></div>
</div>
</body>
</html>
