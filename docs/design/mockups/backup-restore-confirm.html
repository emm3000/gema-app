<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; color: #17181A; background: #FFFFFF; }
    a { color: #3F6836; } a:hover { color: #285020; }
  </style>
</head>
<body>
<div style="width: 360px; height: 800px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center;">
  <div style="position: absolute; left: 4px; top: 8px; display: flex; align-items: center; gap: 4px; width: 340px;">
    <div style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17181A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></div>
    <div style="display: flex; flex-direction: column; flex-grow: 1; gap: 1px;"><div style="font-size: 18px; font-weight: 600; line-height: 1.2;">Respaldo</div><div style="font-size: 13px; color: #6E7075;">Todo lo de este teléfono en un archivo .gema</div></div>
  </div>
  <div style="position: absolute; left: 0; top: 0; width: 360px; height: 800px; background: rgba(23,24,26,0.45);"></div>

  <div style="position: relative; width: 328px; display: flex; flex-direction: column; gap: 16px; padding: 24px; box-sizing: border-box; background: #FFFFFF; border-radius: 12px; box-shadow: 0 12px 32px rgba(23,24,26,0.18);">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="font-size: 20px; font-weight: 600; line-height: 1.3;">¿Restaurar este respaldo?</div>
      <div style="font-size: 13px; color: #6E7075; word-break: break-all;">gema-2026-08-29.gema</div>
    </div>
    <div style="font-size: 15px; line-height: 1.45;">Se reemplaza todo lo que hay en este teléfono:</div>
    <div style="display: flex; flex-direction: column;">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 40px; border-top: 1px solid #E6E6E3;"><div style="width: 40px; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right;">1</div><div style="font-size: 15px;">año escolar</div></div>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 40px; border-top: 1px solid #E6E6E3; border-bottom: 1px solid #E6E6E3;"><div style="width: 40px; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right;">57</div><div style="font-size: 15px;">alumnos</div></div>
    </div>
    <div style="font-size: 13px; line-height: 1.45; color: #6E7075;">La app se reinicia al terminar. No es un error.</div>
    <div style="display: flex; justify-content: flex-end; gap: 8px;">
      <div style="height: 44px; padding: 0 12px; display: flex; align-items: center; font-size: 15px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px;">Cancelar</div>
      <div style="height: 44px; padding: 0 12px; display: flex; align-items: center; font-size: 15px; font-weight: 500; color: #B42318; text-decoration: underline; text-underline-offset: 3px;">Restaurar</div>
    </div>
  </div>
</div>
</body>
</html>
