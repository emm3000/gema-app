<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; color: #17181A; background: #FFFFFF; }
    a { color: #3F6836; } a:hover { color: #285020; }
  </style>
</head>
<body>
<div style="width: 360px; height: 800px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; display: flex; flex-direction: column;">
  <div style="display: flex; flex-direction: column; gap: 6px; padding: 32px 16px 0 16px;">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 1px; color: #6E7075;">PASO 2 DE 2</div>
    <div style="font-size: 24px; font-weight: 600; line-height: 1.2; letter-spacing: -0.3px;">Tu primera sección</div>
    <div style="font-size: 15px; line-height: 1.45; color: #6E7075;">Como figura en tu registro, por ejemplo 3ro A.</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 24px 16px 0 16px;">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 1px; color: #6E7075;">GRADO</div>
    <div style="display: flex; gap: 6px;">
      <div style="flex-grow: 1; height: 48px; display: flex; align-items: center; justify-content: center; border: 1px solid #C9C9C5; border-radius: 8px; font-size: 15px; font-weight: 500;">1</div>
      <div style="flex-grow: 1; height: 48px; display: flex; align-items: center; justify-content: center; border: 1px solid #C9C9C5; border-radius: 8px; font-size: 15px; font-weight: 500;">2</div>
      <div style="flex-grow: 1; height: 48px; display: flex; align-items: center; justify-content: center; border: 2px solid #3F6836; background: #E4EFD9; border-radius: 8px; font-size: 15px; font-weight: 600;">3</div>
      <div style="flex-grow: 1; height: 48px; display: flex; align-items: center; justify-content: center; border: 1px solid #C9C9C5; border-radius: 8px; font-size: 15px; font-weight: 500;">4</div>
      <div style="flex-grow: 1; height: 48px; display: flex; align-items: center; justify-content: center; border: 1px solid #C9C9C5; border-radius: 8px; font-size: 15px; font-weight: 500;">5</div>
      <div style="flex-grow: 1; height: 48px; display: flex; align-items: center; justify-content: center; border: 1px solid #C9C9C5; border-radius: 8px; font-size: 15px; font-weight: 500;">6</div>
    </div>
  </div>

  <div style="padding: 20px 16px 0 16px;">
    <div style="height: 56px; padding: 0 14px; display: flex; flex-direction: column; justify-content: center; gap: 2px; border: 1px solid #C9C9C5; border-radius: 8px; box-sizing: border-box;"><div style="font-size: 11px; color: #6E7075;">Nombre de la sección</div><div style="font-size: 15px; line-height: 1.2;">A</div></div>
  </div>

  <div style="padding: 24px 16px 0 16px;">
    <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; background: #F6F6F4; border-radius: 8px;">
      <div style="font-size: 15px; line-height: 1.45;">Todas las áreas quedan activas.</div>
      <div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px;"><div style="font-size: 15px; font-weight: 500; color: #3F6836; text-decoration: underline; text-underline-offset: 3px;">No dicto todas las áreas</div><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3F6836" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></div>
    </div>
  </div>

  <div style="padding: 16px 16px 0 16px; font-size: 13px; line-height: 1.45; color: #6E7075;">Si enseñas en aula multigrado, crea una sección por grado.</div>

  <div style="flex-grow: 1;"></div>
  <div style="flex-shrink: 0; padding: 12px 16px 16px 16px; border-top: 1px solid #E6E6E3; background: #FFFFFF;"><div style="height: 48px; display: flex; align-items: center; justify-content: center; background: #3F6836; color: #FFFFFF; font-size: 15px; font-weight: 500; border-radius: 8px;">Terminar</div></div>
</div>
</body>
</html>
