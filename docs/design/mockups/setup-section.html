<!doctype html>
<html>
<head>
  <meta charset="utf-8">
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; color: #191D17; -webkit-font-smoothing: antialiased; }
    a { color: #3F6836; } a:hover { color: #285020; }
    .ico { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</helmet>
<div style="width: 360px; height: 780px; background: #F8FBF1; display: flex; flex-direction: column; overflow: hidden;">
  <div style="display: flex; flex-direction: column; gap: 4px; padding: 24px 16px 8px 16px;">
    <span style="font-size: 13px; font-weight: 500; color: #43483F;">Paso 2 de 2</span>
    <span style="font-size: 24px; font-weight: 700; color: #191D17; line-height: 30px;">Tu primera sección</span>
    <span style="font-size: 14px; color: #43483F;">Ya casi. Después puedes crear todas las secciones que dictes.</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 20px; padding: 16px 16px 0 16px; flex-grow: 1;">
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 14px; font-weight: 500; color: #191D17;">Grado</span>
      <div style="display: flex; gap: 8px;">
        <div style="display: flex; align-items: center; justify-content: center; flex: 1 1 0; height: 52px; border: 1px solid #73796E; border-radius: 12px; background: #FFFFFF; font-size: 17px; font-weight: 700; color: #191D17;">1</div>
        <div style="display: flex; align-items: center; justify-content: center; flex: 1 1 0; height: 52px; border: 1px solid #73796E; border-radius: 12px; background: #FFFFFF; font-size: 17px; font-weight: 700; color: #191D17;">2</div>
        <div style="display: flex; align-items: center; justify-content: center; flex: 1 1 0; height: 52px; border: 2px solid #3F6836; border-radius: 12px; background: #C0EFB0; font-size: 17px; font-weight: 700; color: #285020;">3</div>
        <div style="display: flex; align-items: center; justify-content: center; flex: 1 1 0; height: 52px; border: 1px solid #73796E; border-radius: 12px; background: #FFFFFF; font-size: 17px; font-weight: 700; color: #191D17;">4</div>
        <div style="display: flex; align-items: center; justify-content: center; flex: 1 1 0; height: 52px; border: 1px solid #73796E; border-radius: 12px; background: #FFFFFF; font-size: 17px; font-weight: 700; color: #191D17;">5</div>
        <div style="display: flex; align-items: center; justify-content: center; flex: 1 1 0; height: 52px; border: 1px solid #73796E; border-radius: 12px; background: #FFFFFF; font-size: 17px; font-weight: 700; color: #191D17;">6</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px;">
      <span style="font-size: 12px; font-weight: 500; color: #43483F;">Nombre de la sección</span>
      <div style="display: flex; align-items: center; height: 52px; padding: 0 16px; border: 1px solid #73796E; border-radius: 12px; background: #FFFFFF; font-size: 17px; color: #191D17;">A</div>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; background: #ECEFE5; border-radius: 16px;">
      <svg class="ico" style="width: 20px; height: 20px; color: #43483F; flex-shrink: 0;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 8h.01"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1;">
        <span style="font-size: 14px; color: #191D17;">Todas las áreas quedan activas.</span>
        <div style="display: flex; align-items: center; gap: 4px; color: #3F6836;">
          <span style="font-size: 14px; font-weight: 500;">No dicto todas las áreas</span>
          <svg class="ico" style="width: 18px; height: 18px;" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"></path></svg>
        </div>
      </div>
    </div>

    <span style="font-size: 13px; color: #43483F;">Si enseñas en aula multigrado, crea una sección por grado.</span>
  </div>

  <div style="display: flex; padding: 12px 16px 24px 16px; background: #F8FBF1; border-top: 1px solid #DFE4D7;">
    <div style="display: flex; align-items: center; justify-content: center; height: 52px; flex-grow: 1; background: #3F6836; color: #FFFFFF; border-radius: 12px; font-size: 16px; font-weight: 500;">Terminar</div>
  </div>
</div>
</x-dc>
</body>
</html>
