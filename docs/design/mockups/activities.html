<!doctype html>
<html>
<head>
  <meta charset="utf-8">
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; color: #191D17; -webkit-font-smoothing: antialiased; }
    a { color: #3F6836; } a:hover { color: #285020; }
    .ico { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .arow { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #DFE4D7; }
    .adate { display: flex; align-items: center; justify-content: center; padding: 3px 8px; border-radius: 8px; background: #ECEFE5; font-size: 13px; font-weight: 700; color: #285020; flex-shrink: 0; }
  </style>
</helmet>
<div style="width: 360px; height: 780px; background: #F8FBF1; display: flex; flex-direction: column; overflow: hidden; position: relative;">
  <div style="display: flex; align-items: center; height: 64px; padding: 0 8px; gap: 4px;">
    <div style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #191D17;">
      <svg class="ico" viewBox="0 0 24 24"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>

    <div style="display: flex; flex-direction: column; flex-grow: 1;">

    </div>
  </div>

  <div style="display: flex; flex-direction: column; flex-grow: 1; border-top: 1px solid #DFE4D7;">
    <div class="arow">
      <div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span class="adate">05/07</span>
          <span style="font-size: 15px; font-weight: 500; color: #191D17;">Ficha de convivencia</span>
        </div>
        <span style="font-size: 13px; color: #43483F;">PPSS 02 · 24 de 30 con evidencia</span>
      </div>
      <svg class="ico" style="width: 20px; height: 20px; color: #73796E;" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"></path></svg>
    </div>
    <div class="arow">
      <div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span class="adate">22/06</span>
          <span style="font-size: 15px; font-weight: 500; color: #191D17;">Debate del aula</span>
        </div>
        <span style="font-size: 13px; color: #285020;">PPSS 01, PPSS 02 · 30 de 30 con evidencia</span>
      </div>
      <svg class="ico" style="width: 20px; height: 20px; color: #73796E;" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"></path></svg>
    </div>
    <div class="arow">
      <div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span class="adate">10/06</span>
          <span style="font-size: 15px; font-weight: 500; color: #191D17;">Lectura en grupo</span>
        </div>
        <span style="font-size: 13px; color: #43483F;">COMU 01 · 18 de 30 con evidencia</span>
      </div>
      <svg class="ico" style="width: 20px; height: 20px; color: #73796E;" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"></path></svg>
    </div>
  </div>

  <div style="position: absolute; right: 16px; bottom: 24px; display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 20px 0 16px; background: #C0EFB0; color: #285020; border-radius: 16px; font-size: 15px; font-weight: 500;">
    <svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>
    <span>Nueva actividad</span>
  </div>
</div>
</x-dc>
</body>
</html>
