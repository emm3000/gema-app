<!doctype html>
<html>
<head>

</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; color: #191D17; -webkit-font-smoothing: antialiased; }
    a { color: #3F6836; } a:hover { color: #285020; }
    .ico { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .nrow { display: flex; align-items: center; gap: 14px; height: 56px; padding: 0 16px; border-bottom: 1px solid #DFE4D7; }
    .nlabel { font-size: 16px; color: #191D17; flex-grow: 1; }
    .nvalue { font-size: 14px; color: #43483F; }
  </style>
</helmet>
<div style="width: 360px; height: 780px; background: #F8FBF1; display: flex; flex-direction: column; overflow: hidden;">
  <div style="display: flex; align-items: center; height: 64px; padding: 0 8px; gap: 4px;">
    <div style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #191D17;">
      <svg class="ico" viewBox="0 0 24 24"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column; flex-grow: 1;">
      <span style="font-size: 18px; font-weight: 500; color: #191D17;">3ro A</span>
      <span style="font-size: 13px; color: #43483F;">30 alumnos · II Bimestre</span>
    </div>
    <div style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #43483F;">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="12" cy="19" r="1.5"></circle></svg>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 16px; padding: 4px 16px 0 16px; flex-grow: 1;">
    <div style="display: flex; align-items: center; gap: 8px; color: #285020;">
      <svg class="ico" style="width: 18px; height: 18px;" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"></path></svg>
      <span style="font-size: 13px; color: #43483F;">Plantilla SIAGIE cargada</span>

      <span style="font-size: 12px; font-weight: 700; letter-spacing: 1px; color: #43483F;">ASISTENCIA DE HOY</span>
      <span style="font-size: 18px; font-weight: 700; color: #191D17;">Martes 10 de setiembre</span>
      <span style="font-size: 14px; color: #43483F;">Sin tomar</span>
      <div style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; margin-top: 12px; background: #3F6836; color: #FFFFFF; border-radius: 12px; font-size: 15px; font-weight: 500;">
        <svg class="ico" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"></path></svg>
        <span>Tomar asistencia de hoy</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #C3C8BC; border-radius: 16px; overflow: hidden;">
      <div class="nrow">
        <svg class="ico" style="color: #43483F;" viewBox="0 0 24 24"><path d="M16 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1"></path><circle cx="9.5" cy="7" r="3.5"></circle><path d="M21 19v-1a4 4 0 0 0-3-3.9"></path></svg>

        <span class="nvalue">30</span>
        <svg class="ico" style="width: 20px; height: 20px; color: #73796E;" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"></path></svg>
      </div>
      <div class="nrow">
        <svg class="ico" style="color: #43483F;" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18"></path><path d="M8 3v4M16 3v4"></path></svg>
        <span class="nlabel">Asistencia</span>
        <svg class="ico" style="width: 20px; height: 20px; color: #73796E;" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"></path></svg>
      </div>
      <div class="nrow">
        <svg class="ico" style="color: #43483F;" viewBox="0 0 24 24"><path d="M4 5h16v14H4z"></path><path d="M4 10h16"></path><path d="M10 10v9"></path></svg>
        <span class="nlabel">Niveles del periodo</span>
        <span style="font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 12px; background: #FFDAD6; color: #93000A;">12 faltan</span>
        <svg class="ico" style="width: 20px; height: 20px; color: #73796E;" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"></path></svg>

      <div class="nrow">
        <svg class="ico" style="color: #43483F;" viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"></path><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"></path></svg>

        <span class="nvalue">5</span>
        <svg class="ico" style="width: 20px; height: 20px; color: #73796E;" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"></path></svg>
      </div>
      <div class="nrow" style="border-bottom: none;">
        <svg class="ico" style="color: #43483F;" viewBox="0 0 24 24"><path d="M12 15V3"></path><path d="M7 8l5-5 5 5"></path><path d="M5 21h14"></path><path d="M5 17v4M19 17v4"></path></svg>
        <span class="nlabel">Exportar</span>
        <svg class="ico" style="width: 20px; height: 20px; color: #73796E;" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"></path></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
